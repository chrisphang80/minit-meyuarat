  <style>
    /* UI Base Typography */
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }

    /* Official A4 Document Preview Styling (Matches Malaysian MOE Circular Standard) */
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      color: #000000;
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      font-size: 11pt;
      line-height: 1.42;
      padding: 15mm 18mm 18mm 18mm;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.14), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
      margin: 0 auto 24px auto;
      position: relative;
      box-sizing: border-box;
    }

    .a4-sheet table.doc-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 10px 0;
      font-size: 10pt;
    }

    .a4-sheet table.doc-table th,
    .a4-sheet table.doc-table td {
      border: 1px solid #000000;
      padding: 4px 6px;
      text-align: center !important;
      vertical-align: middle !important;
    }

    .a4-sheet table.doc-table th {
      background-color: #f3f4f6;
      font-weight: bold;
      text-align: center !important;
    }

    .a4-sheet table.doc-table th {
      background-color: #f3f4f6;
      font-weight: bold;
      text-align: center;
    }

    .a4-sheet table.meta-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11pt;
    }

    .a4-sheet table.meta-table td {
      padding: 2px 0;
      vertical-align: top;
    }

    /* Custom Scrollbar for Editor */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Print Styles: Clean A4 Output with Zero UI Clutter */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm 15mm 15mm 15mm;
      }
      body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      #preview-scroll-container {
        overflow: visible !important;
        height: auto !important;
        padding: 0 !important;
        background: #ffffff !important;
      }
      #preview-zoom-wrapper {
        transform: none !important;
        width: 100% !important;
        margin: 0 !important;
      }
      .a4-sheet {
        width: 100% !important;
        min-height: auto !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        page-break-after: always;
        break-after: page;
      }
      .a4-sheet:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .avoid-break {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
  </style>

    let uiLang = localStorage.getItem(STORAGE_KEYS.LANG) === 'ms' ? 'ms' : 'zh';

    function t(key) {
      const dict = I18N[uiLang] || I18N.zh;
      return dict[key] !== undefined ? dict[key] : (I18N.zh[key] || key);
    }

    function setUiLanguage(lang) {
      uiLang = lang === 'ms' ? 'ms' : 'zh';
      localStorage.setItem(STORAGE_KEYS.LANG, uiLang);
      updateStaticUiLanguage();
      renderLetterheadControlBar();
      renderEditor();
      showToast(t('toastLangSwitched'), 'info');
    }

    function updateStaticUiLanguage() {
      const btnZh = document.getElementById('lang-btn-zh');
      const btnMs = document.getElementById('lang-btn-ms');
      if (btnZh && btnMs) {
        if (uiLang === 'zh') {
          btnZh.className = 'px-2.5 py-1 rounded-md text-[11px] font-bold bg-amber-500 text-slate-950 shadow-xs transition';
          btnMs.className = 'px-2.5 py-1 rounded-md text-[11px] font-bold text-slate-300 hover:text-white transition';

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const MALAY_MONTHS = [
      'Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun',
      'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'
    ];

    function formatDateMalay(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      const year = parts[0];
      const monthIdx = parseInt(parts[1], 10) - 1;
      const day = parts[2].padStart(2, '0');
      const monthName = MALAY_MONTHS[monthIdx] || parts[1];
      return `${day} ${monthName} ${year}`;
    }

    function formatDateDot(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      return `${parts[2].padStart(2, '0')}.${parts[1].padStart(2, '0')}.${parts[0]}`;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-slate-900 text-white border-emerald-500',
        info: 'bg-blue-900 text-white border-blue-400',
        warning: 'bg-amber-900 text-white border-amber-400'
      };
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg border-l-4 text-xs font-medium flex items-center gap-2 transition-all duration-300 ${colors[type] || colors.success}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function showConfirm(title, message, onConfirm) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      confirmCallback = onConfirm;
      const modal = document.getElementById('confirm-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeConfirmModal() {
      const modal = document.getElementById('confirm-modal');
      modal.classList.add('hidden');

    }

    function applyPreset(presetId) {
      const preset = MEETING_PRESETS.find((p) => p.id === presetId);
      if (!preset) return;

      const bilPadded = String(meetingData.bil || '1').padStart(2, '0');
      const year = meetingData.year || '2026';

      meetingData.presetId = preset.id;
      meetingData.code = preset.code;
      meetingData.committeeName = preset.committeeName;
      meetingData.meetingTitle = `${preset.meetingTitlePrefix} Bil ${meetingData.bil}/${year}`;
      meetingData.rujukanKami = `${preset.code}/${bilPadded}/${year}`;
      meetingData.recipient = preset.recipient;
      meetingData.salutation = preset.salutation;
      meetingData.activityBanner = preset.activityBanner;
      meetingData.memberColHeader = preset.memberColHeader;
      meetingData.signatoryRole = preset.signatoryRole;
      meetingData.closingPhrase = preset.closingPhrase;
      meetingData.includeMadani = preset.includeMadani;
      meetingData.agenda = [...preset.defaultAgenda];

      const savedRoster = rosters[preset.id];
      meetingData.members =
        savedRoster && savedRoster.length > 0
          ? [...savedRoster]
          : [...preset.defaultRoster];

      if (preset.id === 'PANITIA_SEJ' && !preset.defaultMinutes) {
        const initSample = createInitialMeetingData();
        meetingData.ucapanPengerusi = initSample.ucapanPengerusi;
        meetingData.maklumBalas = JSON.parse(JSON.stringify(initSample.maklumBalas));
        meetingData.perbincangan = JSON.parse(JSON.stringify(initSample.perbincangan));
        meetingData.halHalLain = JSON.parse(JSON.stringify(initSample.halHalLain));
      } else if (preset.defaultMinutes) {
        meetingData.ucapanPengerusi = preset.defaultMinutes.ucapanPengerusi;
        meetingData.maklumBalas = JSON.parse(JSON.stringify(preset.defaultMinutes.maklumBalas || []));
        meetingData.perbincangan = JSON.parse(JSON.stringify(preset.defaultMinutes.perbincangan || []));
        meetingData.halHalLain = JSON.parse(JSON.stringify(preset.defaultMinutes.halHalLain || []));
      }

      persistCurrentState();
      renderEditor();
      renderPreview();
      showToast(`${t('toastPresetApplied')}${preset.committeeName}`);
    }

    function updateField(key, value) {
      meetingData[key] = value;

      if (key === 'bil' || key === 'year' || key === 'code') {
        const bilNum = String(meetingData.bil || '1').trim();
        const bilPadded = bilNum.padStart(2, '0');
        const yr = String(meetingData.year || '2026').trim();
        const cd = String(meetingData.code || 'SEJ').trim().toUpperCase();
        meetingData.rujukanKami = `${cd}/${bilPadded}/${yr}`;

        const preset = MEETING_PRESETS.find((p) => p.id === meetingData.presetId);
        const prefix = preset ? preset.meetingTitlePrefix : `Mesyuarat ${meetingData.committeeName}`;
        meetingData.meetingTitle = `${prefix} Bil ${bilNum}/${yr}`;
      }

      if (key === 'pengerusi' && value) {
        const cleaned = value.replace(/^(Pn\.|En\.|Cik|Dato'|Datin|Dr\.|Guru Besar)\s+/i, '').trim().toUpperCase();
        if (cleaned) {
          meetingData.signatoryName = cleaned;
        }
      }

      persistCurrentState();
      renderPreview();
    }

    function carryForwardMeeting() {
      showConfirm(
        t('carryTitle'),
        t('carryMsg'),
        () => {
          const nextBil = (parseInt(meetingData.bil || '1', 10) || 1) + 1;
          const carriedMaklumBalas = (meetingData.perbincangan || []).map((item) => ({
            title: item.title,
            content: item.content,
            tindakan: item.tindakan || 'Makluman',
            table: item.table ? JSON.parse(JSON.stringify(item.table)) : null
          }));

          meetingData.bil = String(nextBil);
          updateField('bil', String(nextBil));
          meetingData.maklumBalas = carriedMaklumBalas;
          meetingData.ucapanPengerusi = `Pengerusi mengucapkan ribuan terima kasih atas kesudian semua ahli menghadiri ${meetingData.meetingTitle}.`;

          persistCurrentState();
          renderEditor();
          renderPreview();
          showToast(`${t('toastCarried')}${nextBil}/${meetingData.year}`);
        }
      );
    }

    // =========================================================================
    // 10. LIVE A4 PREVIEW RENDERER (3-IN-1 OFFICIAL DOCUMENTS)
    // =========================================================================
    function buildPreviewLetterheadHtml() {
      const showJata = schoolConfig.showJata !== false;
      const showCrest = schoolConfig.showCrest !== false;
      const isJataLeft = schoolConfig.logoOrder !== 'crest-left';

      const jataHtml = showJata
        ? (schoolConfig.customJataDataUrl
            ? `<img src="${schoolConfig.customJataDataUrl}" alt="Jata Negara" style="height:82px;max-width:116px;width:auto;object-fit:contain;" />`
            : DEFAULT_JATA_NEGARA_SVG)
        : '';

      const crestHtml = showCrest
        ? (schoolConfig.customCrestDataUrl
            ? `<img src="${schoolConfig.customCrestDataUrl}" alt="Lencana Sekolah" style="height:82px;max-width:100px;width:auto;object-fit:contain;" />`
            : DEFAULT_SCHOOL_CREST_SVG)
        : '';

      const leftLogo = isJataLeft ? jataHtml : crestHtml;
      const rightLogo = isJataLeft ? crestHtml : jataHtml;

      const centerHtml = `
        <div style="text-align:center;line-height:1.25;">
          <div style="font-size:12pt;font-weight:bold;">${escapeHtml(schoolConfig.name)}</div>
          <div style="font-size:10pt;">${escapeHtml(schoolConfig.address1)}</div>
          <div style="font-size:10pt;">${escapeHtml(schoolConfig.address2)}</div>
          <div style="font-size:10pt;">Kod Sekolah: ${escapeHtml(schoolConfig.kodSekolah)}</div>
          <div style="font-size:9.5pt;">Tel/Fax: ${escapeHtml(schoolConfig.telFax)} &nbsp;&nbsp;&nbsp;&nbsp; Email: ${escapeHtml(schoolConfig.email)}</div>
        </div>
      `;

      if (leftLogo && rightLogo) {
        return `
          <table style="width:100%;border-collapse:collapse;border-bottom:2px solid #000000;margin-bottom:8px;">
            <tr>
              <td style="width:116px;text-align:left;vertical-align:middle;padding-bottom:6px;">${leftLogo}</td>
              <td style="vertical-align:middle;padding:0 6px 6px 6px;">${centerHtml}</td>
              <td style="width:116px;text-align:right;vertical-align:middle;padding-bottom:6px;">${rightLogo}</td>
            </tr>
          </table>
        `;
      } else if (leftLogo && !rightLogo) {
        return `
          <table style="width:100%;border-collapse:collapse;border-bottom:2px solid #000000;margin-bottom:8px;">
            <tr>
              <td style="width:116px;text-align:left;vertical-align:middle;padding-bottom:6px;">${leftLogo}</td>
              <td style="vertical-align:middle;padding:0 6px 6px 6px;">${centerHtml}</td>
            </tr>
          </table>
        `;
      } else if (!leftLogo && rightLogo) {
        return `
          <table style="width:100%;border-collapse:collapse;border-bottom:2px solid #000000;margin-bottom:8px;">
            <tr>
              <td style="vertical-align:middle;padding:0 6px 6px 6px;">${centerHtml}</td>
              <td style="width:116px;text-align:right;vertical-align:middle;padding-bottom:6px;">${rightLogo}</td>
            </tr>
          </table>
        `;
      } else {
        return `
          <div style="border-bottom:2px solid #000000;padding-bottom:6px;margin-bottom:8px;">
            ${centerHtml}
          </div>
        `;
      }
    }

    function renderDocTableHtml(tableObj) {
      if (!tableObj || !tableObj.headers || !tableObj.rows) return '';
      return `
        <table class="doc-table avoid-break">
          <thead>
            <tr>
              ${tableObj.headers.map((h) => `<th style="text-align:center;">${escapeHtml(h)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${tableObj.rows
              .map((row) => {
                const isTotalRow =
                  row[0] && String(row[0]).trim().toLowerCase().startsWith('jumlah');
                return `
                  <tr style="${isTotalRow ? 'font-weight:bold;background-color:#f9fafb;' : ''}">
                    ${row
                      .map(
                        (cell) =>
                          `<td style="text-align:center;">${escapeHtml(cell)}</td>`
                      )
                      .join('')}
                  </tr>
                `;
              })
              .join('')}
          </tbody>
        </table>
      `;
    }

    // =========================================================================
    // 11. NATIVE .DOCX (OFFICE OPEN XML) EXPORT ENGINE (100% EXACT A4 LAYOUT)
    // =========================================================================
    function svgToPngDataUrl(svgString, targetW, targetH) {
      return new Promise((resolve) => {
        try {
          const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement('canvas');
            const scale = 2;
            canvas.width = targetW * scale;
            canvas.height = targetH * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            resolve(canvas.toDataURL('image/png'));
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            resolve(null);
          };
          img.src = url;
        } catch (e) {
          resolve(null);
        }
      });
    }

    function dataUrlToUint8Array(dataUrl) {
      if (!dataUrl || !dataUrl.includes(',')) return null;
      const base64 = dataUrl.split(',')[1];
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }

    // =========================================================================
    // 12. AI MALAY BUREAUCRATIC WRITING ASSISTANT
    // =========================================================================
    function openAiModal() {
      const modal = document.getElementById('ai-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeAiModal() {
      const modal = document.getElementById('ai-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function fillSampleAiPrompt() {
      document.getElementById('ai-input-notes').value =
        '讨论国庆月常识比赛，定在2026年8月28日举行，由Pn. Long Feew Leng负责。计划书已获校方批准，将准备40份奖品，费用从历史小组PCG余额RM681.41中拨出。';
    }

    function generateAiMinutes() {
      const notes = (document.getElementById('ai-input-notes').value || '').trim();
      if (!notes) {
        showToast(t('toastAiNeedInput'), 'warning');
        return;
      }

      const targetSec = document.getElementById('ai-target-section').value;
      const tone = document.getElementById('ai-tone').value;

      // Smart KPM Malay Bureaucratic Formatter
      let title = 'Perkara Berbincang & Ketetapan Mesyuarat';
      let tindakan =
        tone === 'formal_pibg'
          ? 'AJK PIBG & Pentadbiran Sekolah'
          : tone === 'formal_pentadbiran'
          ? 'Semua GPK & Guru'
          : `Semua guru ${meetingData.committeeName}`;

      // Extract dates, RM amounts, and names if present
      const dateMatch = notes.match(/(\d{4}年\d{1,2}月\d{1,2}日|\d{1,2}[./-]\d{1,2}[./-]\d{2,4})/);
      const rmMatch = notes.match(/RM\s?\d+(?:\.\d{2})?/i);
      const personMatch = notes.match(/(Pn\.|En\.|Cik|Dato'|Datin|Dr\.|Guru Besar)\s*[A-Za-z\s]+/i);

      if (notes.includes('国庆') || notes.includes('Kemerdekaan')) {
        title = 'Sambutan Bulan Kemerdekaan & Pertandingan Kuiz Patriotisme';
      } else if (notes.includes('考试') || notes.includes('评估') || notes.includes('UASA') || notes.includes('PBD')) {
        title = 'Penyelarasan Pentaksiran Bilik Darjah (PBD) & UASA';
      } else if (notes.includes('拨款') || notes.includes('PCG') || notes.includes('预算') || notes.includes('费用')) {
        title = 'Anggaran Perbelanjaan & Pengurusan Kewangan / PCG';
      } else if (notes.includes('家协') || notes.includes('PIBG')) {
        title = 'Usul & Kerjasama Pembangunan Sekolah Bersama PIBG';
      }

      const lines = [];
      let subIdx = 1;

      if (dateMatch) {
        lines.push(`(i) Aktiviti / program tersebut telah ditetapkan untuk dilaksanakan pada ${dateMatch[0]} mengikut takwim sekolah.`);
        subIdx++;
      }
      if (personMatch) {
        const pic = personMatch[0].trim();
        lines.push(`(${subIdx === 1 ? 'i' : 'ii'}) Penyelaras yang dipertanggungjawabkan untuk mengendalikan pelaksanaan program ini ialah ${pic}.`);
        tindakan = pic;
        subIdx++;
      }
      if (notes.includes('批准') || notes.includes('lulus')) {
        lines.push(`(${subIdx === 1 ? 'i' : subIdx === 2 ? 'ii' : 'iii'}) Kertas kerja program telah dibentangkan dan mendapat kelulusan daripada pihak pentadbiran sekolah.`);
        subIdx++;
      }
      if (rmMatch || notes.includes('奖品') || notes.includes('PCG')) {
        const budgetText = rmMatch ? ` (peruntukan semasa: ${rmMatch[0].toUpperCase()})` : '';
        lines.push(
          `(${subIdx === 1 ? 'i' : subIdx === 2 ? 'ii' : subIdx === 3 ? 'iii' : 'iv'}) Perbelanjaan bagi penyediaan hadiah serta keperluan bahan akan menggunakan peruntukan sedia ada${budgetText} mengikut tatacara kewangan yang berkuat kuasa.`
        );
      }

      if (lines.length === 0) {
        lines.push(
          `(i) Mesyuarat mengambil maklum dan membincangkan perkara berikut: ${notes}`,
          `(ii) Semua ahli mesyuarat bersetuju sebulat suara untuk melaksanakan ketetapan ini mengikut jadual yang telah dirancang.`
        );
      }

      if (targetSec === 'sec1') {
        title = 'Ucapan Pengerusi / Penasihat';
        lines.length = 0;
        lines.push(
          `Pengerusi mengalu-alukan kehadiran semua ahli mesyuarat dan merakamkan ucapan terima kasih atas komitmen tinggi dalam menjayakan agenda sekolah. (${notes})`
        );
        tindakan = 'Makluman';
      }

      document.getElementById('ai-out-title').value = title;
      document.getElementById('ai-out-content').value = lines.join('\n');
      document.getElementById('ai-out-tindakan').value = tindakan;
      document.getElementById('ai-result-tindakan-badge').textContent = `Tindakan: ${tindakan}`;
      document.getElementById('ai-result-container').classList.remove('hidden');
    }

    function insertAiResultToMinutes() {
      const targetSec = document.getElementById('ai-target-section').value;
      const title = document.getElementById('ai-out-title').value.trim();
      const content = document.getElementById('ai-out-content').value.trim();
      const tindakan = document.getElementById('ai-out-tindakan').value.trim() || 'Makluman';

      if (targetSec === 'sec1') {
        meetingData.ucapanPengerusi = content;
      } else {
        const mapKey = {
          sec2: 'maklumBalas',
          sec4: 'perbincangan',
          sec5: 'halHalLain'
        }[targetSec] || 'perbincangan';

        meetingData[mapKey].push({
          title,
          content,
          tindakan,
          table: null
        });
      }

      persistCurrentState();
      switchEditorTab('minutes');
      renderPreview();
      closeAiModal();
      showToast(t('toastAiInserted'));
    }

    // =========================================================================
    // 13. VIEWPORT, FILTER & ZOOM CONTROLS
    // =========================================================================
    function setMobileView(view) {
      const edPane = document.getElementById('editor-pane');
      const prPane = document.getElementById('preview-pane');
      const tabEd = document.getElementById('mobile-tab-editor');
      const tabPr = document.getElementById('mobile-tab-preview');

      if (view === 'editor') {
        edPane.classList.remove('hidden');
        prPane.classList.add('hidden');
        prPane.classList.remove('flex');
        tabEd.className = 'px-3 py-1 text-xs font-medium rounded-md bg-blue-600 text-white transition';
        tabPr.className = 'px-3 py-1 text-xs font-medium rounded-md text-slate-300 hover:text-white transition';
      } else {
        edPane.classList.add('hidden');
        prPane.classList.remove('hidden');
        prPane.classList.add('flex');
        tabPr.className = 'px-3 py-1 text-xs font-medium rounded-md bg-blue-600 text-white transition';
        tabEd.className = 'px-3 py-1 text-xs font-medium rounded-md text-slate-300 hover:text-white transition';
      }
    }

    function setDocFilter(filterKey) {
      activeDocFilter = filterKey;
      ['all', 'part1', 'part2', 'part3'].forEach((k) => {
        const btn = document.getElementById(`filter-${k}`);
        if (!btn) return;
        if (k === filterKey) {
          btn.className = 'px-2.5 py-1 rounded-md font-semibold bg-white text-blue-600 shadow-sm transition';
        } else {
          btn.className = 'px-2.5 py-1 rounded-md font-medium text-slate-600 hover:text-slate-900 transition';
        }
      });
      renderPreview();
    }

    function applyZoom() {
      const wrapper = document.getElementById('preview-zoom-wrapper');
      const label = document.getElementById('zoom-label');
      if (wrapper) {
        wrapper.style.transform = `scale(${currentZoom.toFixed(2)})`;
      }
      if (label) {
        label.textContent = `${Math.round(currentZoom * 100)}%`;
      }
    }

    function adjustZoom(delta) {
      currentZoom = Math.min(1.4, Math.max(0.45, currentZoom + delta));
      applyZoom();
    }

    function resetZoom() {
      currentZoom = 0.85;
      applyZoom();
    }

    // =========================================================================
    // 14. INITIALIZE ON WINDOW LOAD
    // =========================================================================
    window.onload = function () {
      updateStaticUiLanguage();
      renderHeaderCrestBadge();
      renderLetterheadControlBar();
      renderEditor();
      renderPreview();
      applyZoom();
    };
